<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Preload critical hero image for LCP -->
    <link rel="preload" href="/images/hero-bg.jpg" as="image" fetchpriority="high" />
    <!-- Preload critical font hint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Morocco's Premier Tour Company – Best Travel Morocco</title>
    <meta name="title" content="Morocco's Premier Tour Company – Best Travel Morocco" />
    <meta name="description" content="We craft bespoke Tours and Travel packages in Morocco that will take you off the beaten track. Founded in 2004, we've welcomed over 20,000 guests from around the world. Your Morocco Tour experts." />
    <meta name="keywords" content="Morocco tours, Sahara desert tours, Marrakech tours, Chefchaouen, Fes tours, Morocco travel agency, desert trips Morocco, Morocco vacation packages, Best Travel Morocco" />
    <meta name="author" content="Best Travel Morocco" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.besttravelmorocco.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.besttravelmorocco.com" />
    <meta property="og:title" content="Morocco's Premier Tour Company – Best Travel Morocco" />
    <meta property="og:description" content="We craft bespoke Tours and Travel packages in Morocco that will take you off the beaten track. Founded in 2004, we've welcomed over 20,000 guests from around the world." />
    <meta property="og:image" content="https://www.besttravelmorocco.com/images/hero-bg.jpg" />
    <meta property="og:site_name" content="Best Travel Morocco" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.besttravelmorocco.com" />
    <meta property="twitter:title" content="Morocco's Premier Tour Company – Best Travel Morocco" />
    <meta property="twitter:description" content="We craft bespoke Tours and Travel packages in Morocco that will take you off the beaten track. Founded in 2004, we've welcomed over 20,000 guests from around the world." />
    <meta property="twitter:image" content="https://www.besttravelmorocco.com/images/hero-bg.jpg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23C9A96E'/><text x='50' y='65' font-size='45' text-anchor='middle' fill='%2315151a' font-family='serif'>B</text></svg>" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Best Travel Morocco",
      "url": "https://www.besttravelmorocco.com",
      "description": "We craft bespoke Tours and Travel packages in Morocco that will take you off the beaten track. Founded in 2004, we've welcomed over 20,000 guests from around the world.",
      "foundingDate": "2004",
      "telephone": "+212-677-365-421",
      "email": "hello@besttravelmorocco.com",
      "openingHours": "Mo-Su 00:00-23:59",
      "priceRange": "$$-$$$",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "500"
      }
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Best Travel Morocco",
      "url": "https://www.besttravelmorocco.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.besttravelmorocco.com/tours?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#C9A96E" />
    <meta name="msapplication-TileColor" content="#C9A96E" />
    
    <!-- Apple Touch Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Best Travel Morocco" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
